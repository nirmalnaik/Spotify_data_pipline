<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 474" role="img" aria-labelledby="title desc"><title id="title">Spotify Data Pipeline</title><desc id="desc">Spotify API and Python feed the extraction workflow. CloudWatch schedules Lambda extraction to raw S3. An S3 object event invokes the transformation Lambda, which writes to transformed S3. A Glue crawler updates the Glue Data Catalog for Athena queries.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1060" height="474" rx="20" fill="#0b1322" stroke="#0b1322"/><text x="26" y="42" fill="#f1f5ff" font-size="28" font-weight="700">Spotify Data Pipeline</text><text x="27" y="67" fill="#a9b9d0" font-size="15" font-weight="400">AWS architecture</text><rect x="242" y="91" width="794" height="352" rx="16" fill="#101b2c" stroke="#354761"/><text x="260" y="113" fill="#a9b9d0" font-size="12" font-weight="700">AWS CLOUD</text><text x="24" y="139" fill="#a9b9d0" font-size="13" font-weight="700">SOURCE</text><rect x="260" y="124" width="214" height="28" rx="7" fill="#1a2940" stroke="#31415a"/><text x="270" y="143" fill="#79aeff" font-size="12" font-weight="700">01   EXTRACT</text><rect x="530" y="124" width="214" height="28" rx="7" fill="#1a2940" stroke="#31415a"/><text x="540" y="143" fill="#57dfba" font-size="12" font-weight="700">02   TRANSFORM</text><rect x="800" y="124" width="214" height="28" rx="7" fill="#1a2940" stroke="#31415a"/><text x="810" y="143" fill="#c8a7ff" font-size="12" font-weight="700">03   LOAD &amp; QUERY</text><rect x="260" y="174" width="214" height="68" rx="12" fill="#172437" stroke="#354761"/><rect x="272" y="191" width="34" height="34" rx="7" fill="#d62a72"/><g transform="translate(277 196)" fill="none" stroke="white" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16a4 4 0 0 1 0-8 6 6 0 0 1 11-1 4 4 0 0 1 3 3M4 16h5"/><circle cx="15" cy="15" r="4"/><path d="m18 18 3 3"/></g><text x="307" y="204" fill="#f1f5ff" font-size="16" font-weight="700">CloudWatch</text><text x="307" y="225" fill="#b4c2d8" font-size="12">Scheduled trigger</text><rect x="260" y="263" width="214" height="68" rx="12" fill="#172437" stroke="#354761"/><rect x="272" y="280" width="34" height="34" rx="7" fill="#ee871d"/><g transform="translate(277 285)" fill="none" stroke="white" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h6l7 15h3v3h-6L8 6H6zM9 12l-6 9h5l4-6"/></g><text x="307" y="293" fill="#f1f5ff" font-size="16" font-weight="700">Lambda</text><text x="307" y="314" fill="#b4c2d8" font-size="12">Extract Spotify data</text><rect x="260" y="352" width="214" height="68" rx="12" fill="#172437" stroke="#354761"/><rect x="272" y="369" width="34" height="34" rx="7" fill="#429437"/><g transform="translate(277 374)" fill="none" stroke="white" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="m3 5 2 14q7 4 14 0l2-14M8 12h8m-4-4v8"/></g><text x="307" y="382" fill="#f1f5ff" font-size="16" font-weight="700">Amazon S3</text><text x="307" y="403" fill="#b4c2d8" font-size="12">Raw data</text><rect x="530" y="174" width="214" height="68" rx="12" fill="#172437" stroke="#354761"/><rect x="542" y="191" width="34" height="34" rx="7" fill="#429437"/><g transform="translate(547 196)" fill="none" stroke="white" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="m3 5 2 14q7 4 14 0l2-14M8 12h8m-4-4v8"/></g><text x="577" y="204" fill="#f1f5ff" font-size="16" font-weight="700">Amazon S3</text><text x="577" y="225" fill="#b4c2d8" font-size="12">Transformed data</text><rect x="530" y="263" width="214" height="68" rx="12" fill="#172437" stroke="#354761"/><rect x="542" y="280" width="34" height="34" rx="7" fill="#ee871d"/><g transform="translate(547 285)" fill="none" stroke="white" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h6l7 15h3v3h-6L8 6H6zM9 12l-6 9h5l4-6"/></g><text x="577" y="293" fill="#f1f5ff" font-size="16" font-weight="700">Lambda</text><text x="577" y="314" fill="#b4c2d8" font-size="12">Transform data</text><rect x="530" y="352" width="214" height="68" rx="12" fill="#172437" stroke="#354761"/><rect x="542" y="369" width="34" height="34" rx="7" fill="#bf2963"/><g transform="translate(547 374)" fill="none" stroke="white" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 5 13h6l-1 9 9-12h-6z"/></g><text x="577" y="382" fill="#f1f5ff" font-size="16" font-weight="700">S3 object event</text><text x="577" y="403" fill="#b4c2d8" font-size="12">Object PUT trigger</text><rect x="800" y="174" width="214" height="68" rx="12" fill="#172437" stroke="#354761"/><rect x="812" y="191" width="34" height="34" rx="7" fill="#7856db"/><g transform="translate(817 196)" fill="none" stroke="white" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="16" rx="2"/><path d="M3 8h18M8 8v11m3-8h6m-6 4h6"/></g><text x="847" y="204" fill="#f1f5ff" font-size="16" font-weight="700">Glue crawler</text><text x="847" y="225" fill="#b4c2d8" font-size="12">Infer schema</text><rect x="800" y="263" width="214" height="68" rx="12" fill="#172437" stroke="#354761"/><rect x="812" y="280" width="34" height="34" rx="7" fill="#7856db"/><g transform="translate(817 285)" fill="none" stroke="white" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h7l2 2h9v14H3zM7 11h10M7 15h10"/></g><text x="847" y="293" fill="#f1f5ff" font-size="16" font-weight="700">Glue Data Catalog</text><text x="847" y="314" fill="#b4c2d8" font-size="12">Store table metadata</text><rect x="800" y="352" width="214" height="68" rx="12" fill="#172437" stroke="#354761"/><rect x="812" y="369" width="34" height="34" rx="7" fill="#7856db"/><g transform="translate(817 374)" fill="none" stroke="white" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r=